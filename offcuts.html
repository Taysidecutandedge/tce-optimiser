<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TCE — Offcut Stock</title>
<style>
:root{--bg:#0a0b0f;--surf:#15171e;--surf2:#1e2128;--brd:#2a2e38;--txt:#f0eeea;--txt2:#a8b0bd;--txt3:#6b7280;--acc:#d4820a;--ok:#27ae60;--warn:#c0392b;--mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 0 90px}
header{position:sticky;top:0;z-index:10;background:var(--surf);border-bottom:2px solid var(--acc);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;font-weight:700;letter-spacing:.3px}
header .sub{font-size:11px;color:var(--txt3);font-family:var(--mono)}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
a.link,button{font-family:inherit}
.btn{background:var(--surf2);border:1px solid var(--brd);color:var(--txt);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600}
.btn:active{transform:scale(.97)}
.btn-acc{background:var(--acc);color:#111;border-color:var(--acc)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:6px}
.btn-ghost{background:transparent}
.btn-danger{color:#ff8a80;border-color:#5a2a2a}
section{padding:14px 16px}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--txt2);font-weight:600}
input,select{background:var(--surf2);border:1px solid var(--brd);color:var(--txt);border-radius:8px;padding:11px;font-size:16px;width:100%;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.row-inline{display:flex;gap:8px;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt2)}
.chk input{width:20px;height:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:140px}
.toolbar select{width:auto;min-width:110px}
.count{font-size:12px;color:var(--txt3);font-family:var(--mono)}
.oc{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.oc .swatch{width:34px;height:34px;border-radius:7px;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
.oc .body{flex:1;min-width:0}
.oc .code{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.5px}
.oc .decor{font-size:15px;font-weight:700;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .meta{font-size:13px;color:var(--txt2);font-family:var(--mono)}
.oc .loc{display:inline-block;background:var(--surf2);border:1px solid var(--brd);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--txt);margin-top:4px;font-family:var(--mono)}
.oc .acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.pill-qty{font-family:var(--mono);font-size:12px;color:var(--txt3)}
.grp{margin-bottom:8px;border:1px solid var(--brd);border-radius:10px;overflow:hidden;background:var(--surf)}
.grp-hdr{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.grp-hdr:active{background:var(--surf2)}
.grp-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-sub{font-size:12px;color:var(--txt3);font-family:var(--mono)}
.grp-chev{color:var(--txt2);font-size:13px;flex-shrink:0}
.grp-body{padding:0 8px 8px}
.grp-body .oc{background:var(--surf2)}
/* scanned offcut (opened from the QR on the label) */
.scan{background:var(--surf);border:2px solid var(--acc);border-radius:14px;padding:16px;margin-bottom:14px}
.scan .s-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.scan .s-code{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--acc);letter-spacing:1px}
.scan .s-close{margin-left:auto}
.scan .s-decor{font-size:18px;font-weight:700;margin-bottom:4px}
.scan .s-size{font-family:var(--mono);font-size:20px;font-weight:700;margin-bottom:8px}
.scan .s-bay{display:inline-block;background:var(--acc);color:#111;font-weight:800;font-family:var(--mono);font-size:18px;border-radius:8px;padding:4px 12px;margin-bottom:8px}
.scan .s-line{font-size:14px;color:var(--txt2);margin-top:4px}
.scan .s-warn{background:#3a1d1d;border:1px solid #5a2a2a;color:#ff8a80;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.scan .s-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.scan .s-acts .btn{flex:1;min-width:90px;padding:12px}
.empty{text-align:center;color:var(--txt3);padding:40px 16px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#c0392b;color:#fff}
/* login */
#login{max-width:380px;margin:60px auto;padding:0 18px}
#login .card{padding:22px}
#login h1{font-size:20px;margin-bottom:4px}
#login p{font-size:13px;color:var(--txt3);margin-bottom:18px}
.hidden{display:none!important}
/* sticky add button on mobile */
.fab{position:fixed;bottom:16px;right:16px;z-index:20}
/* print label */
@media print{
  body *{visibility:hidden}
  #labelArea,#labelArea *{visibility:visible}
  #labelArea{position:absolute;left:0;top:0;width:57mm;height:32mm;padding:2mm;color:#000;background:#fff}
}
#labelArea{display:none}
.lbl-code{font-family:var(--mono);font-weight:700;font-size:20pt}
.lbl-decor{font-size:10pt;font-weight:700}
.lbl-meta{font-size:9pt}
</style>
</head>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="card">
    <h1>Offcut Stock</h1>
    <p>Sign in with your TCE optimiser account.</p>
    <p id="li-scan" class="hidden" style="color:var(--acc)"></p>

<div id="app" class="hidden">
  <header>
    <div>
      <h1>Offcut Stock</h1>
      <div class="sub" id="userline"></div>
    </div>
    <div class="right">

    </div>
  </header>

  <div class="wrap">
    <!-- SCANNED OFFCUT (from the QR on a label) -->

    <!-- CAMERA SCANNER — full-screen while open, closes on a hit or on Close -->
    <div id="scanOverlay" class="hidden" style="position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column">

        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62vw;max-width:300px;aspect-ratio:1;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)"></div>
      </div>

      <div class="card">

        <div class="grid">
          <div class="field full">
            <label>Decor / colour</label>
            <input id="f-name" list="decorlist" placeholder="e.g. Egger H1385 Natural Castella Oak" oninput="onDecorInput()">

          </div>
          <div class="field full">
            <label>Description / notes <span style="color:var(--txt3)">(optional · stored, not on label)</span></label>
            <input id="f-descr" placeholder="e.g. chip on one corner, good face one side">
          </div>
          <div class="field"><label>Length (mm)</label><input id="f-l" type="number" inputmode="numeric" placeholder="1200"></div>
          <div class="field"><label>Width (mm)</label><input id="f-w" type="number" inputmode="numeric" placeholder="480"></div>

          <div class="field full">
            <div class="chk"><input id="f-grain" type="checkbox" checked><label for="f-grain" style="font-size:14px">Grain runs along the length</label></div>
          </div>
          <div class="field full">

    <!-- LIST -->

        <select id="fgroup" onchange="renderList()"><option value="decor">Group: decor</option><option value="cust">Group: customer</option></select>
        <span class="count" id="count"></span>

<!-- hidden print label -->
<div id="labelArea">

  <div class="lbl-decor" id="lbl-decor"></div>
  <div class="lbl-meta" id="lbl-meta"></div>
  <div class="lbl-meta" id="lbl-loc"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://mxjduublgtlpqtdgutzi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14amR1dWJsZ3RscHF0ZGd1dHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTg2MjMsImV4cCI6MjA5MTY3NDYyM30.wfG9a91Udp7KQ7ywda6aNS9k-n79qtrGSe-epuCuk34';
let _token=null,_user=null;
let _offcuts=[],_decors=[],_editingId=null;
// Code from a scanned label QR (offcuts.html?oc=OC-7K2M)
let _scanCode=(new URLSearchParams(location.search).get('oc')||'').trim().toUpperCase();

const H=()=>({'apikey':SB_KEY,'Authorization':'Bearer '+(_token||SB_KEY),'Content-Type':'application/json'});
const Hrep=()=>({...H(),'Prefer':'return=representation'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',1900);}

// ---- auth ----
// The access token expires after about an hour. Saving only that one meant a phone in the
// rack dropped back to the login screen several times a shift — and a scan that asks for a
// password is a scan nobody does. The refresh token is long-lived, so we keep it too and
// trade it for a fresh access token whenever the old one has gone stale.
async function _refreshSession(){
  const rt=localStorage.getItem('tce_refresh'); if(!rt) return false;
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:rt})});
    if(!r.ok) return false;
    const d=await r.json();
    if(!d.access_token) return false;
    _saveSession(d);
    return true;
  }catch(e){ return false; }
}
function _saveSession(d){
  _token=d.access_token;
  _user={id:(d.user&&d.user.id)||(_user&&_user.id),email:(d.user&&d.user.email)||(_user&&_user.email)};
  localStorage.setItem('tce_token',_token);
  if(d.refresh_token) localStorage.setItem('tce_refresh',d.refresh_token);
  if(_user&&_user.id) localStorage.setItem('tce_user',JSON.stringify(_user));
}
async function init(){
  const tok=localStorage.getItem('tce_token');
  if(tok){
    try{
      const r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok}});
      if(r.ok){const d=await r.json();_token=tok;_user={id:d.id,email:d.email};return showApp();}
    }catch(e){}
  }
  // Access token missing or expired — try the refresh token before asking for a password.
  if(await _refreshSession()){
    try{
      const r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+_token}});
      if(r.ok){ const d=await r.json(); _user={id:d.id,email:d.email}; return showApp(); }
    }catch(e){}
  }
  showLogin();
}
// Renew in the background well before expiry, so a session left open on the bench phone
// doesn't quietly go stale between scans.
setInterval(()=>{ if(_token) _refreshSession(); }, 45*60*1000);
function showLogin(){
  $('login').classList.remove('hidden');$('app').classList.add('hidden');
  if(_scanCode){ const h=$('li-scan'); h.textContent='Sign in once on this device to open offcut '+_scanCode+'.'; h.classList.remove('hidden'); }
}
async function showApp(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('userline').textContent=_user.email;
  await loadDecors();
  await loadOffcuts();
  if(_scanCode) window.scrollTo({top:0});
}
async function doLogin(){
  $('li-err').textContent='';
  const email=$('li-email').value.trim(),password=$('li-pass').value;
  if(!email||!password){$('li-err').textContent='Enter email and password.';return;}
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error_description||d.msg||'Sign in failed');
    _saveSession(d);
    showApp();
  }catch(e){$('li-err').textContent=e.message;}
}
function signOut(){localStorage.removeItem('tce_token');localStorage.removeItem('tce_refresh');localStorage.removeItem('tce_user');_token=null;_user=null;showLogin();}

// ---- camera scanner ----------------------------------------------------------
// Scanning with the phone's own camera app meant leaving this page, pointing, tapping the
// banner and waiting for a reload — four steps while holding a sheet of board, and worse
// again for a run of offcuts. This keeps it in the page: tap Scan, point, it jumps to the
// offcut. The typed-code box stays as the fallback for a refused camera or a dusty lens.
let _scanStream=null, _scanRAF=null, _jsqrLoading=null;
// jsQR is fetched only when the button is first used, so nobody pays for it otherwise, and
// the browser caches it after that. The page already needs the network for Supabase, so a
// CDN script costs no offline ability that we had.
function _loadJsQR(){
  if(typeof jsQR==='function') return Promise.resolve(true);
  if(_jsqrLoading) return _jsqrLoading;
  _jsqrLoading=new Promise(res=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload=()=>res(typeof jsQR==='function');
    s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
  return _jsqrLoading;
}
// A scanned label gives a full URL; accept a bare code too, in case a different scanner or a
// hand-typed value gets here. Anything that isn't one of ours is reported rather than ignored.
function _codeFromScan(text){
  const t=String(text||'').trim();
  const m=t.match(/[?&]oc=([^&\s]+)/i);
  if(m) return decodeURIComponent(m[1]).toUpperCase();
  if(/^OC-[A-Z0-9]{3,}$/i.test(t)) return t.toUpperCase();
  return null;
}
function _setScanState(msg){ const el=$('scanState'); if(el) el.textContent=msg; }
async function openScanner(){
  const ov=$('scanOverlay'); if(!ov) return;
  ov.classList.remove('hidden');
  _setScanState('starting camera…');
  const ok=await _loadJsQR();
  if(!ok){ _setScanState('scanner unavailable'); $('scanHint').textContent='Could not load the scanner. Use your phone camera, or type the code into the search box.'; return; }
  try{
    _scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    _setScanState('no camera');
    $('scanHint').textContent='Camera not allowed. Allow it in your browser settings, or type the code into the search box.';
    return;
  }
  const v=$('scanVideo');
  v.srcObject=_scanStream;
  try{ await v.play(); }catch(e){}
  _setScanState('looking…');
  const c=document.createElement('canvas'), g=c.getContext('2d',{willReadFrequently:true});
  let frame=0;
  const tick=()=>{
    if(!_scanStream) return;                       // closed while we were waiting
    _scanRAF=requestAnimationFrame(tick);
    if(v.readyState!==4) return;
    if((frame++ % 2)) return;                      // every other frame is plenty, and halves the battery cost
    const w=Math.min(v.videoWidth,640); const h=Math.round(v.videoHeight*(w/v.videoWidth));
    if(!w||!h) return;
    c.width=w; c.height=h;
    g.drawImage(v,0,0,w,h);
    let res=null;
    try{ res=jsQR(g.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'}); }catch(e){}
    if(!res) return;
    const code=_codeFromScan(res.data);
    if(!code){ _setScanState('not a TCE label'); return; }
    if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
    closeScanner();
    _scanCode=code;
    _scanFetched=null;
    renderScanCard();
    window.scrollTo({top:0,behavior:'smooth'});
  };
  tick();
}
function closeScanner(){
  if(_scanRAF){ cancelAnimationFrame(_scanRAF); _scanRAF=null; }
  // Release the camera properly — a stream left running keeps the lens busy and the light on.
  if(_scanStream){ try{ _scanStream.getTracks().forEach(t=>t.stop()); }catch(e){} _scanStream=null; }
  const v=$('scanVideo'); if(v){ try{ v.pause(); }catch(e){} v.srcObject=null; }
  const ov=$('scanOverlay'); if(ov) ov.classList.add('hidden');
}
// Don't hold the camera while the phone is in a pocket or on another app.
document.addEventListener('visibilitychange',()=>{ if(document.hidden && _scanStream) closeScanner(); });

// ---- data ----
async function loadDecors(){
  // suggest EVERY material ever used (boards + offcuts), de-duplicated by name (case/space-insensitive)
  try{
    const r=await fetch(SB_URL+'/rest/v1/tce_library?select=name,color,thick,is_offcut',{headers:H()});
    if(r.ok){
      const rows=await r.json();
      const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
      const map={};
      rows.forEach(x=>{
        if(!x.name) return; const k=norm(x.name); if(!k) return;
        if(!map[k]){ map[k]={name:x.name,color:x.color,thick:x.thick,isBoard:x.is_offcut===false}; }
        else if(x.is_offcut===false && !map[k].isBoard){ map[k]={name:x.name,color:x.color,thick:x.thick,isBoard:true}; } // prefer a board's canonical spelling
      });
      _decors=Object.values(map).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
      $('decorlist').innerHTML=_decors.map(d=>`<option value="${esc(d.name)}">`).join('');
    }
  }catch(e){}
}
async function loadOffcuts(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/tce_library?select=*&is_offcut=eq.true&status=eq.in_stock&order=name',{headers:H()});
    if(!r.ok){toast('Could not load stock',true);return;}
    _offcuts=await r.json();
    // build thickness filter
    const ths=[...new Set(_offcuts.map(o=>o.thick))].sort((a,b)=>a-b);
    $('fthick').innerHTML='<option value="">All thickness</option>'+ths.map(t=>`<option value="${t}">${t}mm</option>`).join('');
    const decorsInStock=[...new Set(_offcuts.map(o=>o.name))].sort((a,b)=>String(a).localeCompare(String(b)));
    $('fdecor').innerHTML='<option value="">All decors</option>'+decorsInStock.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
    renderList();
  }catch(e){toast('Network error',true);}
}

function genCode(){const a='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';return 'OC-'+Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join('');}

function onDecorInput(){
  const v=$('f-name').value.trim().toLowerCase();
  const m=_decors.find(d=>d.name.toLowerCase()===v);
  if(m&&m.color)$('f-color').value=m.color;
  // auto-set thickness from a leading "Nmm" in the decor name (e.g. "19mm Oak Veneer MDF" → 19) so it can't be missed
  const tm=v.match(/^(\d+(?:\.\d+)?)\s*mm\b/);
  if(tm)$('f-thick').value=tm[1];
  else if(m&&m.thick&&!$('f-thick').value)$('f-thick').value=m.thick;
}

async function addOffcut(){
  const name=$('f-name').value.trim();
  const l=parseInt($('f-l').value),w=parseInt($('f-w').value),thick=parseFloat($('f-thick').value);
  const qty=Math.max(1,parseInt($('f-qty').value)||1);
  if(!name){toast('Enter a decor',true);return;}
  if(!l||!w){toast('Enter length & width',true);return;}
  const base={
    name,l,w,thick:thick||0,cost:0,notes:$('f-cust').value.trim(),descr:$('f-descr').value.trim()||null,
    grain_len:$('f-grain').checked,color:$('f-color').value,
    is_offcut:true,location:$('f-loc').value.trim()||null
  };
  const sep=$('f-sep')&&$('f-sep').checked;
  try{
    let r;
    if(_editingId){
      r=await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+_editingId,{method:'PATCH',headers:Hrep(),body:JSON.stringify({...base,qty})});
      if(!r.ok){const e=await r.text();toast('Save failed',true);console.warn(e);return;}
      const saved=(await r.json())[0]||{}; toast('Updated '+(saved.code||'')); exitEditMode();
    } else if(sep && qty>1){
      // one entry (own code + own labels + own description) per physical board
      const rows=Array.from({length:qty},()=>({...base,qty:1,status:'in_stock',code:genCode(),user_id:_user.id,label_printed:false}));
      r=await fetch(SB_URL+'/rest/v1/tce_library',{method:'POST',headers:Hrep(),body:JSON.stringify(rows)});
      if(!r.ok){const e=await r.text();toast('Save failed',true);console.warn(e);return;}
      toast('Added '+qty+' boards (own codes)'); clearSizeFields(); $('f-l').focus();
    } else {
      r=await fetch(SB_URL+'/rest/v1/tce_library',{method:'POST',headers:Hrep(),body:JSON.stringify({...base,qty,status:'in_stock',code:genCode(),user_id:_user.id,label_printed:false})});
      if(!r.ok){const e=await r.text();toast('Save failed',true);console.warn(e);return;}
      const saved=(await r.json())[0]||{}; toast('Added '+(saved.code||'')); clearSizeFields(); $('f-l').focus();
    }
    await loadOffcuts();
  }catch(e){toast('Network error',true);}
}
function clearSizeFields(){$('f-l').value='';$('f-w').value='';$('f-qty').value='1';$('f-descr').value='';}
function exitEditMode(){
  _editingId=null;
  const b=$('addBtn'); if(b)b.textContent='+ Add to stock';
  const c=$('cancelEditBtn'); if(c)c.style.display='none';
  ['f-name','f-thick','f-l','f-w','f-loc','f-cust','f-descr'].forEach(id=>$(id).value='');
  const sp=$('f-sep'); if(sp)sp.checked=false;
  $('f-qty').value='1';$('f-grain').checked=true;$('f-color').value='#4e9af1';
}
function editOffcut(id){
  const o=_offcuts.find(x=>x.id===id);if(!o)return;
  _editingId=id;
  $('f-name').value=o.name||'';
  $('f-l').value=o.l||'';$('f-w').value=o.w||'';$('f-thick').value=o.thick||'';
  $('f-qty').value=o.qty||1;$('f-loc').value=o.location||'';$('f-cust').value=o.notes||'';$('f-descr').value=o.descr||'';
  $('f-color').value=o.color||'#4e9af1';$('f-grain').checked=!!o.grain_len;
  $('addBtn').textContent='Save changes';
  $('cancelEditBtn').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
  toast('Editing '+(o.code||'')+' — adjust the size if it was re-trimmed');
}

let _expandedDecors=new Set();
const _jsAttr=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
function toggleDecor(name){ if(_expandedDecors.has(name))_expandedDecors.delete(name); else _expandedDecors.add(name); renderList(); }
function ocCard(o){
  return `
    <div class="oc">
      <div class="swatch" style="background:${esc(o.color||'#4e9af1')}"></div>
      <div class="body">
        <div class="code">${esc(o.code||'')}${o.qty>1?` <span class="pill-qty">×${o.qty}</span>`:''}${o.label_printed===false?` <span style="color:#e6a23c;font-size:11px;font-family:var(--mono)">🕓 label queued</span>`:''}</div>
        <div class="meta" style="color:var(--txt);font-weight:600">${esc(o.name)}</div>
        <div class="meta">${o.l} × ${o.w} · ${o.thick}mm${o.grain_len?' · grain ↕':''}</div>
        ${o.location?`<span class="loc">📍 ${esc(o.location)}</span>`:''}
        ${o.notes?`<div class="meta" style="color:var(--txt3);margin-top:3px">👤 ${esc(o.notes)}</div>`:''}
        ${o.descr?`<div class="meta" style="color:var(--txt3);margin-top:3px">📝 ${esc(o.descr)}</div>`:''}
      </div>
      <div class="acts">
        <button class="btn btn-sm" onclick="printLabel(${o.id})">🏷 Label</button>
        <button class="btn btn-sm" onclick="editOffcut(${o.id})">Edit</button>
        <button class="btn btn-sm" onclick="useOne(${o.id})">Use 1</button>
        <button class="btn btn-sm" style="border-color:#2a5a6a;color:#7fd3e3" onclick="moveToStock(${o.id})" title="It's actually a full sheet — move to board stock">↗ To stock</button>
        <button class="btn btn-sm btn-danger" onclick="delOffcut(${o.id})">Scrap</button>
      </div>
    </div>`;
}
function renderList(){
  renderScanCard();
  const q=$('q').value.trim().toLowerCase();
  const ft=$('fthick').value;
  const fd=$('fdecor')?$('fdecor').value:'';
  const sortMode=($('fsort')&&$('fsort').value)||'size';
  let items=_offcuts.slice();
  if(ft!=='')items=items.filter(o=>String(o.thick)===ft);
  if(fd!=='')items=items.filter(o=>o.name===fd);
  if(q)items=items.filter(o=>(o.name+' '+(o.code||'')+' '+(o.location||'')+' '+(o.notes||'')+' '+(o.descr||'')).toLowerCase().includes(q));
  const cmp=({
    size:(a,b)=>(b.l*b.w)-(a.l*a.w),
    newest:(a,b)=>(b.id||0)-(a.id||0),
    bay:(a,b)=>String(a.location||'~~').localeCompare(String(b.location||'~~'))
  })[sortMode]||((a,b)=>(b.l*b.w)-(a.l*a.w));
  const totalPieces=items.reduce((s,o)=>s+(o.qty||1),0);
  const totalM2=items.reduce((s,o)=>s+(o.l*o.w*(o.qty||1)),0)/1e6;
  $('count').textContent=totalPieces+' offcut'+(totalPieces===1?'':'s')+' · '+totalM2.toFixed(2)+' m²'+(ft?(' · '+ft+'mm'):'');
  if(!items.length){$('list').innerHTML='<div class="empty">No offcuts'+(q||ft||fd?' match your filter':' logged yet — add one above')+'.</div>';return;}
  const groupBy=($('fgroup')&&$('fgroup').value)||'decor';
  const keyOf=o=>groupBy==='cust'?(o.notes&&o.notes.trim()?o.notes.trim():'— no customer —'):(o.name||'—');
  const groups={};
  items.forEach(o=>{ const k=keyOf(o); (groups[k]=groups[k]||[]).push(o); });
  const names=Object.keys(groups).sort((a,b)=>String(a).localeCompare(String(b)));
  const searching=!!(q||fd);   // when narrowing, open matching groups automatically
  $('list').innerHTML=names.map(name=>{
    const arr=groups[name].slice().sort(cmp);
    const pcs=arr.reduce((s,o)=>s+(o.qty||1),0);
    const m2=arr.reduce((s,o)=>s+(o.l*o.w*(o.qty||1)),0)/1e6;
    const open=searching||_expandedDecors.has(name);
    const sw=arr[0].color||'#4e9af1';
    return `<div class="grp">
      <div class="grp-hdr" onclick="toggleDecor('${_jsAttr(name)}')">
        <div class="swatch" style="background:${esc(sw)};width:22px;height:22px"></div>
        <div style="flex:1;min-width:0">
          <div class="grp-name">${esc(name)}</div>
          <div class="grp-sub">${pcs} piece${pcs===1?'':'s'} · ${m2.toFixed(2)} m²${ft?(' · '+ft+'mm'):''}</div>
        </div>
        <div class="grp-chev">${open?'▾':'▸'}</div>
      </div>
      ${open?`<div class="grp-body">${arr.map(ocCard).join('')}</div>`:''}
    </div>`;
  }).join('');
}

// ---- scanned offcut card ----
let _scanFetched=null;   // record fetched by code when it isn't in the in-stock list (e.g. already used)
async function renderScanCard(){
  const sec=$('scanSec'); if(!sec) return;
  if(!_scanCode){ sec.classList.add('hidden'); return; }
  let o=_offcuts.find(x=>String(x.code||'').toUpperCase()===_scanCode);
  let warn='';
  if(!o){
    if(!_scanFetched || String(_scanFetched.code||'').toUpperCase()!==_scanCode || _scanFetched._stale){
      try{
        const r=await fetch(SB_URL+'/rest/v1/tce_library?select=*&is_offcut=eq.true&code=eq.'+encodeURIComponent(_scanCode),{headers:H()});
        const rows=r.ok?await r.json():[];
        _scanFetched=rows[0]||{code:_scanCode,_missing:true};
      }catch(e){ _scanFetched={code:_scanCode,_missing:true}; }
    }
    o=_scanFetched;
    if(o._missing) warn='No offcut with code '+esc(_scanCode)+' found. It may have been deleted.';
    else if(o.status==='used') warn='Already marked used'+(o.used_at?(' on '+new Date(o.used_at).toLocaleDateString('en-GB')):'')+'. It should not be in the rack.';
    else warn='This offcut is not in stock.';
  } else { _scanFetched=null; }
  const inStock=!warn;
  sec.classList.remove('hidden');
  $('scanCard').innerHTML=`<div class="scan">
    <div class="s-top">
      <div class="swatch" style="width:30px;height:30px;border-radius:7px;background:${esc(o.color||'#4e9af1')};border:1px solid rgba(255,255,255,.15)"></div>
      <div class="s-code">${esc(o.code||_scanCode)}${o.qty>1?` <span class="pill-qty">×${o.qty}</span>`:''}</div>
      <button class="btn btn-sm" onclick="openScanner()" title="Scan the next offcut">⬚ Scan next</button>
      <button class="btn btn-sm btn-ghost s-close" onclick="closeScan()">✕ Close</button>
    </div>
    ${warn?`<div class="s-warn">${warn}</div>`:''}
    ${o._missing?'':`
    <div class="s-decor">${esc(o.name||'')}</div>
    <div class="s-size">${o.l} × ${o.w} · ${o.thick}mm${o.grain_len?' · grain ↕':''}</div>
    ${o.location?`<div class="s-bay">📍 ${esc(o.location)}</div>`:'<div class="s-line">📍 No bay set (tap Edit to add one)</div>'}
    ${o.notes?`<div class="s-line">👤 ${esc(o.notes)}</div>`:''}
    ${o.descr?`<div class="s-line">📝 ${esc(o.descr)}</div>`:''}
    ${inStock?`<div class="s-acts">
      <button class="btn btn-acc" onclick="useOne(${o.id})">Use 1</button>
      <button class="btn" onclick="editOffcut(${o.id})">Edit</button>
      <button class="btn" onclick="printLabel(${o.id})">🏷 Reprint label</button>
    </div>`:''}`}
  </div>`;
}
function closeScan(){
  _scanCode=''; _scanFetched=null;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  renderScanCard();
}

async function useOne(id){
  const o=_offcuts.find(x=>x.id===id);if(!o)return;
  const newQty=(o.qty||1)-1;
  const patch=newQty<=0?{qty:0,status:'used',used_at:new Date().toISOString()}:{qty:newQty};
  try{
    const r=await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+id,{method:'PATCH',headers:H(),body:JSON.stringify(patch)});
    if(!r.ok){toast('Update failed',true);return;}
    if(_scanFetched) _scanFetched._stale=true;
    toast(newQty<=0?'Marked used':'Used 1 ('+newQty+' left)');
    await loadOffcuts();
  }catch(e){toast('Network error',true);}
}

// Scrap, not destroy. This button lives on a phone in a workshop, one tap behind a single
// confirm — and a hard DELETE took the offcut's history with it, including whatever job it
// came off. Nothing else in the system destroys a record, and this shouldn't either: the row
// is marked scrapped so it leaves the rack list but can still be found and put back.
async function delOffcut(id){
  const o=_offcuts.find(x=>x.id===id);if(!o)return;
  if(!confirm('Scrap '+(o.code||'this offcut')+'?\n\nIt comes off the rack list. The record is kept, so it can be put back if this was a mistake.'))return;
  try{
    const r=await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+id,{method:'PATCH',headers:H(),
      body:JSON.stringify({status:'scrapped',qty:0,used_at:new Date().toISOString()})});
    if(!r.ok){toast('Could not scrap it',true);return;}
    if(_scanFetched) _scanFetched._stale=true;
    toast('Scrapped — record kept');
    await loadOffcuts();
  }catch(e){toast('Network error',true);}
}

// Move a "full sheet" that was logged as an offcut into proper board stock
async function moveToStock(id){
  const o=_offcuts.find(x=>x.id===id); if(!o)return;
  const qty=Math.max(1,parseInt(o.qty)||1);
  if(!confirm(`Move ${qty>1?qty+' × ':''}"${o.name}" (${o.l}×${o.w}) into full-sheet board stock?`))return;
  const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  try{
    const br=await fetch(SB_URL+'/rest/v1/tce_library?select=id,name,thick,stock_qty&is_offcut=eq.false',{headers:H()});
    const boards=br.ok?await br.json():[];
    let board=boards.find(b=>norm(b.name)===norm(o.name)&&String(b.thick)===String(o.thick))||boards.find(b=>norm(b.name)===norm(o.name));
    if(board){
      const newQ=(parseInt(board.stock_qty)||0)+qty;
      const pr=await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+board.id,{method:'PATCH',headers:H(),body:JSON.stringify({stock_qty:newQ})});
      if(!pr.ok){toast('Stock update failed',true);return;}
    } else {
      // It used to offer to create the board here, at the OFFCUT's size and £0 cost. That
      // puts a board in the library that quotes at nothing and is the wrong size — the same
      // fault that left two £0 boards at a guessed 2800x2070 on ross v2. A board is a priced
      // product and belongs in the board list, not invented from a phone in the rack.
      alert('"'+o.name+'" isn\'t in your board list.\n\n'
        +'Add it there first — with the real sheet size and cost — then move this offcut across. '
        +'Creating it from here would make a board at '+o.l+'×'+o.w+' costing £0, and anything quoted on it would be wrong.');
      return;
    }
    const ur=await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:'used',used_at:new Date().toISOString()})});
    toast(ur.ok?'Moved to board stock ✓':'Moved, but offcut not cleared',!ur.ok);
    await loadOffcuts();
  }catch(e){toast('Network error',true);}
}

const DYMO_HOST='https://127.0.0.1';
const DYMO_PORTS=[41951,41952,41953,41954,41955,41956,41957,41958,41959,41960];
let _dymoBase=null,_dymoPrinter='';
async function _probeDymo(base,ms){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  try{const r=await fetch(base+'StatusConnected',{method:'GET',signal:ctrl.signal});clearTimeout(t);
    return r.ok&&(await r.text()).trim().toLowerCase().indexOf('true')>=0;}catch(e){clearTimeout(t);return false;}
}
async function findDymo(){
  for(const port of DYMO_PORTS){
    const base=DYMO_HOST+':'+port+'/DYMO/DLS/Printing/';
    if(await _probeDymo(base,1500)){
      _dymoBase=base;
      try{const xml=await (await fetch(base+'GetPrinters')).text();
        const names=[...xml.matchAll(/<Name>(.*?)<\/Name>/g)].map(m=>m[1]);
        _dymoPrinter=names.find(n=>/labelwriter/i.test(n))||names[0]||'';}catch(e){_dymoPrinter='';}
      return base;
    }
  }
  _dymoBase=null;return null;
}
async function ensureDymo(){return _dymoBase||await findDymo();}

// Scanning the QR on an offcut opens the Offcut Stock page with that offcut pulled up.
const OFFCUT_PAGE_URL='https://taysidecutandedge.github.io/tce-optimiser/offcuts.html';
function offcutScanUrl(code){ return OFFCUT_PAGE_URL+'?oc='+encodeURIComponent(code||''); }
// QR as a base64 PNG for a DYMO <ImageObject> (the same way the sample-label QR prints).
// Low error-correction keeps the squares as big as possible on a small strip.
function qrPngB64(text){
  const q=qrcode(0,'L'); q.addData(text); q.make();
  const n=q.getModuleCount(), quiet=2, px=10, size=(n+quiet*2)*px;
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,size,size); g.fillStyle='#000000';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect((k+quiet)*px,(r+quiet)*px,px,px);
  return c.toDataURL('image/png').split(',')[1];
}
function _ocQrObj(b64,x,y,w,h){
  return '<ImageObject><Name>OcQR</Name>'+
  '<Brushes><BackgroundBrush><SolidColorBrush><Color A="0" R="0" G="0" B="0"></Color></SolidColorBrush></BackgroundBrush><BorderBrush><SolidColorBrush><Color A="1" R="0" G="0" B="0"></Color></SolidColorBrush></BorderBrush><StrokeBrush><SolidColorBrush><Color A="1" R="0" G="0" B="0"></Color></SolidColorBrush></StrokeBrush><FillBrush><SolidColorBrush><Color A="0" R="0" G="0" B="0"></Color></SolidColorBrush></FillBrush></Brushes>'+
  '<Rotation>Rotation0</Rotation><OutlineThickness>1</OutlineThickness><IsOutlined>False</IsOutlined><BorderStyle>SolidLine</BorderStyle><Margin><DYMOThickness Left="0" Top="0" Right="0" Bottom="0" /></Margin>'+
  '<Data>'+b64+'</Data><ScaleMode>Uniform</ScaleMode><HorizontalAlignment>Center</HorizontalAlignment><VerticalAlignment>Middle</VerticalAlignment>'+
  '<ObjectLayout><DYMOPoint><X>'+x+'</X><Y>'+y+'</Y></DYMOPoint><Size><Width>'+w+'</Width><Height>'+h+'</Height></Size></ObjectLayout></ImageObject>';
}
// One character per line, so the code reads straight down the wrap strip. OC- is dropped —
// it's on every offcut, so it would be three lines of nothing, and the full code is printed
// below the fold anyway. Same function exists in tce-offload.html; keep the two in step.
function _stackCode(code){
  const c=String(code||'').replace(/^OC-/i,'').trim().toUpperCase();
  if(!c) return '';
  return c.split('').join('\n');
}
function offcutLabelXml(o){
  // Printed landscape (the orientation the DYMO is happy with), but every field is rotated 90°
  // and laid along the long 57mm edge. Turn the printed label a quarter-turn and it reads TALL:
  // code in the wrap strip, fold guide at ~16.5mm, then code + details on the face.
  const size=`${o.l} x ${o.w}  -  ${o.thick}mm`;
  let cust=o.notes?String(o.notes).replace(/\s*[-—]\s*Rev\s*\d+\s*$/i,'').trim():'';
  if(cust.length>26) cust=cust.slice(0,25).replace(/\s+\S*$/,'').trim()+'…';
  const R='Rotation270', Y=0.06, H=1.01;
  const body=
    // Wrap strip (the bit you see on the edge in the rack): QR + the characters that make the
    // code unique. The full OC- code is still on the face below the fold.
    // KEEP IN STEP WITH tce-offload.html — both pages build this label independently, and a
    // reprint from here produced the old sideways code while the offload station printed the
    // new stacked one. If you change the strip in one, change it in the other.
    _ocQrObj(qrPngB64(offcutScanUrl(o.code)),0.07,0.08,0.44,0.44)+
    // Offcuts stand on edge, so the code is stacked one character per line and reads straight
    // down the strip. _to prints bold with FitMode AlwaysFit, so the box height is what sets
    // the size, not the 26 — the box takes all the strip below the QR.
    _to('OcCodeTop',_stackCode(o.code),26,'Center',0.06,0.53,0.46,0.64,'Rotation180')+
    _to('OcFold','— fold —',7,'Center',0.56,Y,0.10,H,R)+
    _to('OcCode',o.code||'',18,'Center',0.70,Y,0.38,H,R)+
    _to('OcDecor',o.name||'',11,'Center',1.12,Y,0.22,H,R)+
    _to('OcSize',size,13,'Center',1.36,Y,0.26,H,R)+
    _to('OcBay',o.location?('Bay: '+o.location):'',10,'Center',1.66,Y,0.18,H,R)+
    _to('OcCust',cust?('Cust: '+cust):'',10,'Center',1.86,Y,0.18,H,R);
  return `<?xml version="1.0" encoding="utf-8"?><DesktopLabel Version="1"><DYMOLabel Version="4"><Description>DYMO Label</Description><Orientation>Portrait</Orientation><LabelName>S0722540 multipurpose</LabelName><InitialLength>0</InitialLength><BorderStyle>SolidLine</BorderStyle><DYMORect><DYMOPoint><X>0.04</X><Y>0.06</Y></DYMOPoint><Size><Width>2.17</Width><Height>1.13</Height></Size></DYMORect><BorderColor><SolidColorBrush><Color A="1" R="0" G="0" B="0"></Color></SolidColorBrush></BorderColor><BorderThickness>1</BorderThickness><Show_Border>False</Show_Border><HasFixedLength>False</HasFixedLength><FixedLengthValue>0</FixedLengthValue><DynamicLayoutManager><RotationBehavior>ClearObjects</RotationBehavior><LabelObjects>${body}</LabelObjects></DynamicLayoutManager></DYMOLabel></DesktopLabel>`;
}

async function printLabel(id){
  const o=_offcuts.find(x=>x.id===id);if(!o)return;
  toast('Finding printer…');
  const base=await ensureDymo();
  if(base){
    try{
      // 2 labels per offcut, sent as two separate jobs with EMPTY print params — the same call the
      // offload station uses. The 550 rejects a <Copies>2</Copies> block alongside this label format.
      const xml=offcutLabelXml(o);
      const send=()=>fetch(base+'PrintLabel',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'printerName='+encodeURIComponent(_dymoPrinter)+'&labelXml='+encodeURIComponent(xml)+'&printParamsXml=&labelSetXml='});
      const r=await send();
      if(r.ok){
        await new Promise(res=>setTimeout(res,600));   // space the jobs so the 550 doesn't drop the second one
        const r2=await send();
        if(!r2.ok) toast('First label sent, second failed ('+r2.status+') — tap Label again',true);
        if(o.label_printed===false){ try{ await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+o.id,{method:'PATCH',headers:H(),body:JSON.stringify({label_printed:true})}); o.label_printed=true; renderList(); }catch(e){} }
        if(r2.ok) toast('2 labels sent ✓ '+(o.code||''));
        return;
      }
      toast('Printer error '+r.status,true);
    }catch(e){_dymoBase=null;}
  }
  // No local printer (e.g. you're on your phone) → queue it for the workshop station
  try{
    await fetch(SB_URL+'/rest/v1/tce_library?id=eq.'+o.id,{method:'PATCH',headers:H(),body:JSON.stringify({label_printed:false})});
    o.label_printed=false; renderList();
    toast('Queued for the workshop printer ✓');
  }catch(e){ toast('Could not queue label',true); }
}
function browserLabel(o){
  $('lbl-code').textContent=o.code||'';
  $('lbl-decor').textContent=o.name||'';
  $('lbl-meta').textContent=`${o.l} x ${o.w} - ${o.thick}mm`+(o.grain_len?' - grain along length':'');
  $('lbl-loc').textContent=(o.location?('Bay: '+o.location):'')+(o.notes?('   ·   Cust: '+o.notes):'');
  window.print();
}

init();
</script>
